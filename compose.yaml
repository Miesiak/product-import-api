services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: product_import
      POSTGRES_USER: product_app
      POSTGRES_PASSWORD: product_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_app -d product_import"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data: