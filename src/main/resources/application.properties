spring.application.name=product-import-api

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_import}
spring.datasource.username=${DB_USERNAME:product_app}
spring.datasource.password=${DB_PASSWORD:product_app}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false